<!DOCTYPE html>
<html>
<head>
<title>Room Finder</title>
<style>
body{font-family:Arial; text-align:center; padding:30px; background:#f0f8ff}
.box{background:white; padding:20px; border-radius:10px; max-width:400px; margin:auto; box-shadow:0 0 10px gray}
input,button{width:90%; padding:10px; margin:10px; border-radius:5px}
button{background:green; color:white; border:none}
</style>
</head>
<body>
<div class="box">
<h2>Room Finder 🏠</h2>
<p>City takha, rooms chi mahiti email var yeil</p>
<form action="https://formsubmit.co/snehadeshmukh270@gmail.com" method="POST">
<input type="text" name="city" placeholder="City Name - Nagpur" required>
<input type="email" name="email" placeholder="Tumcha Email" required>
<input type="hidden" name="_subject" value="New Room Search - Room Finder">
<input type="hidden" name="_autoresponse" value="Thank you! Tumhi taklelya city madhe rooms available aahet. Aamhi lavkarach contact karu.">
<input type="hidden" name="_captcha" value="false">
<button type="submit">Search & Get Notification</button>
</form>
</div>
</body>
</html>
